<meta charset="utf-8">
<div id="raiz"></div>

<style>
  :root{
    --tinta:#1B1A22;
    --tinta-70:#4A4753;
    --tinta-45:#7C7887;
    --papel:#FBFAF7;
    --papel-2:#F3F0EA;
    --linha:#DDD8CE;
    --roxo:#5B2E86;
    --roxo-claro:#F0E8F8;
    --lugol:#9A6510;
    --lugol-claro:#FBF0DC;
    --teal:#1B6272;
    --teal-claro:#E3F0F2;
    --verde:#2C6349;
    --verde-claro:#E4F0E9;
    --vermelho:#9E2B2B;
    --vermelho-claro:#FAE7E4;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  #raiz *{ box-sizing:border-box; }
  #raiz{
    font-family:var(--sans);
    color:var(--tinta);
    background:var(--papel);
    line-height:1.55;
    font-size:15px;
    padding:0 0 64px;
  }

  .env{ max-width:1080px; margin:0 auto; padding:0 20px; }

  /* ---------- cabecalho ---------- */
  .capa{
    border-bottom:1px solid var(--linha);
    background:
      linear-gradient(180deg, #FFFFFF 0%, var(--papel) 100%);
    padding:34px 0 26px;
  }
  .selo{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--roxo);
    margin-bottom:12px;
  }
  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(26px,3.6vw,40px);
    line-height:1.12;
    margin:0 0 10px;
    letter-spacing:-.01em;
  }
  .sub{ color:var(--tinta-70); max-width:66ch; margin:0 0 18px; }
  .aviso{
    display:flex; gap:10px; align-items:flex-start;
    border-left:3px solid var(--lugol);
    background:var(--lugol-claro);
    padding:11px 14px;
    font-size:13.5px;
    color:#5C4210;
    max-width:78ch;
  }
  .aviso b{ font-weight:600; }

  /* ---------- abas ---------- */
  .abas-barra{
    position:sticky; top:0; z-index:20;
    background:rgba(251,250,247,.94);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--linha);
  }
  .abas{ display:flex; gap:2px; overflow-x:auto; padding:0; scrollbar-width:thin; }
  .aba{
    appearance:none; border:0; background:none;
    font-family:var(--sans); font-size:13.5px; color:var(--tinta-70);
    padding:13px 14px; cursor:pointer; white-space:nowrap;
    border-bottom:2px solid transparent;
  }
  .aba:hover{ color:var(--tinta); }
  .aba[aria-selected="true"]{ color:var(--roxo); border-bottom-color:var(--roxo); font-weight:600; }
  .aba:focus-visible{ outline:2px solid var(--roxo); outline-offset:-2px; }

  .painel{ padding-top:32px; }
  .painel[hidden]{ display:none; }

  h2{
    font-family:var(--serif); font-weight:600;
    font-size:23px; margin:0 0 6px; letter-spacing:-.01em;
  }
  h3{
    font-family:var(--serif); font-weight:600;
    font-size:18px; margin:34px 0 10px;
  }
  .lede{ color:var(--tinta-70); max-width:70ch; margin:0 0 22px; }

  /* ---------- navegador ---------- */
  .nav-grade{
    display:grid; gap:16px;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    margin-bottom:22px;
  }
  .campo label{
    display:block; font-family:var(--mono); font-size:10.5px;
    letter-spacing:.12em; text-transform:uppercase;
    color:var(--tinta-45); margin-bottom:6px;
  }
  .campo select{
    width:100%; font-family:var(--sans); font-size:14px; color:var(--tinta);
    background:#fff; border:1px solid var(--linha); border-radius:2px;
    padding:9px 10px; cursor:pointer;
  }
  .campo select:focus-visible{ outline:2px solid var(--roxo); outline-offset:1px; }
  .campo.oculto{ opacity:.35; pointer-events:none; }

  .resultado{
    border:1px solid var(--linha);
    border-left:5px solid var(--roxo);
    background:#fff;
    padding:22px 24px;
    animation:surge .22s ease-out;
  }
  @keyframes surge{ from{opacity:0; transform:translateY(4px);} to{opacity:1;transform:none;} }
  @media (prefers-reduced-motion:reduce){ .resultado{ animation:none; } }

  .resultado h4{
    font-family:var(--serif); font-size:20px; font-weight:600;
    margin:0 0 4px;
  }
  .resultado .cenario{
    font-family:var(--mono); font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--tinta-45); margin-bottom:14px;
  }

  /* ---------- passos ---------- */
  ol.passos{ list-style:none; margin:0; padding:0; }
  ol.passos > li{
    position:relative; padding:0 0 18px 30px;
  }
  ol.passos > li:last-child{ padding-bottom:0; }
  ol.passos > li::before{
    content:attr(data-n);
    position:absolute; left:0; top:1px;
    width:19px; height:19px; border-radius:50%;
    background:var(--roxo-claro); color:var(--roxo);
    font-family:var(--mono); font-size:10.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  ol.passos > li:not(:last-child)::after{
    content:""; position:absolute; left:9px; top:23px; bottom:2px;
    width:1px; background:var(--linha);
  }

  .ramo{
    display:grid; grid-template-columns:minmax(150px,.85fr) 1.15fr;
    gap:0; border-top:1px solid var(--linha);
  }
  .ramo:last-of-type{ border-bottom:1px solid var(--linha); }
  .ramo .se{
    padding:11px 14px 11px 0; font-weight:600; font-size:14px;
  }
  .ramo .entao{ padding:11px 0 11px 16px; border-left:1px solid var(--linha); }
  .ramos-titulo{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--tinta-45);
    margin:20px 0 2px;
  }

  /* ---------- etiquetas de conduta ---------- */
  .tom{
    display:inline-block; font-family:var(--mono);
    font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    padding:2px 7px; border-radius:2px; margin-right:8px;
    vertical-align:1px; font-weight:600;
  }
  .tom.investigar{ background:var(--teal-claro); color:var(--teal); }
  .tom.vigiar{ background:var(--roxo-claro); color:var(--roxo); }
  .tom.tratar{ background:var(--lugol-claro); color:var(--lugol); }
  .tom.encaminhar{ background:var(--vermelho-claro); color:var(--vermelho); }
  .tom.alta{ background:var(--verde-claro); color:var(--verde); }

  .ref{
    font-family:var(--mono); font-size:11px; color:var(--tinta-45);
    white-space:nowrap;
  }
  .ref::before{ content:"rec. "; }

  .nota{
    margin-top:18px; padding:12px 14px;
    background:var(--papel-2); border-left:3px solid var(--linha);
    font-size:13.5px; color:var(--tinta-70);
  }

  /* ---------- cartoes de fluxo ---------- */
  .bloco{
    border:1px solid var(--linha); background:#fff;
    margin-bottom:18px; padding:20px 22px;
    break-inside:avoid;
  }
  .bloco > .entrada{
    font-family:var(--serif); font-size:17px; font-weight:600;
    margin:0 0 4px; line-height:1.3;
  }
  .bloco > .condicao{
    font-family:var(--mono); font-size:11px; color:var(--roxo);
    letter-spacing:.06em; margin-bottom:16px;
  }

  /* ---------- legenda ---------- */
  .legenda{
    display:flex; flex-wrap:wrap; gap:8px 18px;
    padding:14px 0 24px; border-bottom:1px solid var(--linha);
    margin-bottom:26px; font-size:13px; color:var(--tinta-70);
  }

  /* ---------- definicoes ---------- */
  dl.defs{ margin:0; }
  dl.defs dt{
    font-weight:600; margin-top:18px;
    font-family:var(--serif); font-size:16.5px;
  }
  dl.defs dd{ margin:4px 0 0; color:var(--tinta-70); max-width:78ch; }
  table.siglas{ border-collapse:collapse; width:100%; margin-top:10px; font-size:14px; }
  table.siglas td{ border-bottom:1px solid var(--linha); padding:7px 10px 7px 0; vertical-align:top; }
  table.siglas td:first-child{ font-family:var(--mono); font-size:12.5px; white-space:nowrap; width:1%; padding-right:22px; color:var(--roxo); }

  .rodape{
    margin-top:44px; padding-top:18px; border-top:1px solid var(--linha);
    font-size:12.5px; color:var(--tinta-45); max-width:80ch;
  }

  @media (max-width:640px){
    .ramo{ grid-template-columns:1fr; }
    .ramo .entao{ border-left:0; padding:0 0 11px 0; }
    .ramo .se{ padding-bottom:2px; }
  }

  @media print{
    .abas-barra, .nav-grade{ display:none; }
    .painel[hidden]{ display:block !important; }
    #raiz{ background:#fff; font-size:11pt; }
    .bloco{ page-break-inside:avoid; }
  }
</style>

<script>

      lede:"Capítulo 5. O método excisional é o preferido. O teste de DNA-HPV é mais acurado que o estado das margens para prever recidiva, e por isso comanda o seguimento.",
      blocos:[
        { entrada:"Boas práticas antes de tratar", cond:"Qualquer lesão precursora", passos:[
            { t:"Ofertar o tratamento no primeiro atendimento. Não sendo possível, realizá-lo em até 3 meses.", ref:"5.1.1", tom:"tratar" },
            { t:"Se o tratamento não ocorrer em até 6 meses, repetir a colposcopia antes de tratar.", ref:"5.1.2", tom:"investigar" },
            { t:"Em gestantes, adiar o tratamento para 12 semanas após o parto, precedido de nova avaliação.", ref:"5.1.3", tom:"vigiar" },
            { t:"Obter consentimento informado, verbal ou preferencialmente escrito, em linguagem acessível, com registro em prontuário.", ref:"5.1.4", tom:"investigar" }
          ] },
        { entrada:"Escolha da técnica", cond:"Excisão estratificada pelo tipo de ZT", passos:[
            { t:"Excisão tipo 1 para ZT tipo 1, até 10 mm de profundidade. Tipo 2 para ZT tipo 2, até 15 mm. Tipo 3 acima de 15 mm, preferencialmente 20 mm, indicada para ZT tipo 3, suspeita de microinvasão ou doença glandular.", ref:"5.2.4", tom:"tratar" },
            { t:"Não são aceitáveis: eletrocauterização cirúrgica, crioterapia, agentes tópicos, vacinas terapêuticas e outros produtos biológicos. A histerectomia é inaceitável como terapia primária de HSIL.", ref:"5.2.2", tom:"encaminhar" },
            { t:"Não usar a técnica \u201ctop-hat\u201d para excisão complementar do canal.", ref:"5.2.5", tom:"tratar" },
            { t:"Em comunidades isoladas sem acesso à excisão, o tratamento ablativo é possível se a mulher preencher os critérios de elegibilidade: ZT visível (tipo 1 ou 2), todas as áreas suspeitas totalmente visíveis e ausência de suspeita de câncer ou de doença glandular. Não elegíveis vão para excisão.", ref:"5.2.6 e 6e.2.4", tom:"tratar" }
          ] },
        { entrada:"Vigilância após tratamento de HSIL", cond:"Mulher de risco habitual", passos:[
            { t:"Primeira visita aos 6 meses, com avaliação clínica e teste de DNA-HPV oncogênico. A colposcopia não é necessária nessa visita.", ref:"5.3.2", tom:"vigiar" },
            { t:"Resultado negativo: novo DNA-HPV 12 meses depois, ou seja, cerca de 18 meses após o tratamento.", ref:"5.3.2", tom:"vigiar" },
            { t:"Teste de cura: dois DNA-HPV consecutivamente negativos com 12 meses de intervalo (aos 6 e aos 18 meses).", ref:"5.3.3", tom:"alta" }
          ], ramos:[
            { se:"Teste de cura obtido", entao:"Retorno ao rastreamento regular com DNA-HPV a cada 5 anos, com documento de contrarreferência para a APS.", ref:"5.3.3 e 5.3.4", tom:"alta" },
            { se:"Teste de cura não obtido", entao:"Permanecer sob vigilância com DNA-HPV anual na média complexidade até atingir o teste de cura.", ref:"5.3.3", tom:"vigiar" },
            { se:"Qualquer DNA-HPV positivo no seguimento", entao:"Nova colposcopia, independentemente da genotipagem ou da citologia, conduzindo o caso como a lesão inicial. Vale inclusive para quem já teve alta e voltou ao rastreamento na APS.", ref:"5.3.6", tom:"investigar" },
            { se:"Uma ou mais margens comprometidas por HSIL", entao:"Novo tratamento excisional é aceitável, sobretudo acima de 50 anos, quando a margem acometida for a endocervical ou quando houver obstáculos à adesão ao seguimento.", ref:"5.3.5", tom:"tratar" },
            { se:"Doença de alto grau após tratamento excisional, com nova excisão indicada", entao:"Histerectomia total apenas quando um novo procedimento excisional não for viável.", ref:"5.3.9", tom:"tratar" },
            { se:"Doença de alto grau após tratamento ablativo", entao:"O novo tratamento deve ser excisional.", ref:"5.3.10", tom:"tratar" }
          ] },
        { entrada:"Vigilância com um terceiro teste", cond:"Imunossupressão, ou histerectomia por AIS ou FIGO IA1", passos:[
            { t:"Terceiro DNA-HPV cerca de 12 meses após o segundo negativo. Após três testes consecutivamente negativos, rastreamento a cada 3 anos por pelo menos 25 anos.", ref:"5.3.7", tom:"vigiar" },
            { t:"Tratamento conservador do FIGO IA1 com excisão tipo 3: considera-se tratada após margens negativas para HSIL, AIS ou carcinoma. Primeira visita aos 6 meses com DNA-HPV e citologia; se negativos, repetir aos 18 e 30 meses. Três visitas negativas permitem rastreamento a cada 3 anos.", ref:"5.3.8", tom:"vigiar" }
          ] },
        { entrada:"Enquanto o DNA-HPV não estiver disponível", cond:"Fase de implementação", passos:[
            { t:"Margens livres ou comprometidas por LSIL (NIC1): citologia aos 6 e 12 meses após o tratamento.", ref:"5.3.11", tom:"vigiar" },
            { t:"Qualquer margem comprometida por HSIL (NIC2-3): citologia associada à colposcopia a cada 6 meses durante os primeiros 2 anos.", ref:"5.3.11", tom:"vigiar" },
            { t:"Lesão residual ou recorrente: conduzir conforme as recomendações aplicáveis à lesão inicial.", ref:"5.3.11", tom:"tratar" }
          ] }
      ]
    },
    {
      id:"cap6",
      titulo:"Situações especiais",
      lede:"Capítulo 6. Mulheres histerectomizadas, após a menopausa, vivendo com HIV ou imunossuprimidas, gestantes e em situação de vulnerabilidade.",
      blocos:[
        { entrada:"Histerectomizadas", cond:"Sem lesão na peça, com antecedente de HSIL tratada por excisão", passos:[
            { t:"Havendo registro de DNA-HPV negativo antes da histerectomia: rastreamento a cada 5 anos. Se o antecedente for AIS, a cada 3 anos.", ref:"6a.1", tom:"alta" },
            { t:"Sem registro de DNA-HPV negativo prévio: teste aos 6 meses após a cirurgia e, se negativo, repetição 12 meses depois. Dois negativos consecutivos liberam o rastreamento (5 anos para HSIL, 3 anos para AIS).", ref:"6a.2", tom:"vigiar" },
            { t:"Histerectomia por HSIL ou AIS, ou doença identificada na peça: mesmo esquema de dois testes, aos 6 e aos 18 meses.", ref:"6a.3", tom:"vigiar" },
            { t:"Entregar documento de contrarreferência com o momento e a periodicidade do teste, para apresentar na APS.", ref:"6a.4", tom:"alta" }
          ] },
        { entrada:"Após a menopausa", cond:"Preparo antes da colposcopia", passos:[
            { t:"Estrogenização preferencial com creme de estriol 1 mg/g, um aplicador vaginal (0,5 mg) ao dia por 14 noites consecutivas. Colposcopia entre 3 e 7 dias após a suspensão.", ref:"6b.1", tom:"investigar" },
            { t:"Sem estrogenização prévia, realizar a colposcopia mesmo assim e repeti-la após o preparo estrogênico se houver ausência ou incerteza quanto às alterações.", ref:"6b.2", tom:"investigar" }
          ] },
        { entrada:"Vivendo com HIV ou imunossuprimidas", cond:"Colposcopia normal, ZT tipo 1 ou 2", r:R.imuno_normal_zt12 },
        { entrada:"Vivendo com HIV ou imunossuprimidas", cond:"Colposcopia normal, ZT tipo 3", r:R.imuno_normal_zt3 },
        { entrada:"Vivendo com HIV ou imunossuprimidas", cond:"Achados colposcópicos anormais", r:R.imuno_anormal },
        { entrada:"Gestantes", cond:"Colposcopia e conduta na gravidez", r:R.gest_geral },
        { entrada:"Gestantes com HPV 16/18 e colposcopia normal", cond:"Conforme o tipo de ZT", passos:[
            { t:"ZT tipo 1 ou 2: repetir o DNA-HPV 12 meses após o resultado anterior.", ref:"6d.2.1", tom:"vigiar" },
            { t:"ZT tipo 3: realizar escovado de canal endocervical. Resultado normal, ASC-US, ASC-H, LSIL, HSIL, AGC ou AIS leva a repetir a colposcopia 12 semanas após o parto. Carcinoma invasor leva a centro oncológico de referência.", ref:"6d.2.2", tom:"investigar" }
          ] },
        { entrada:"Dificuldade de acesso e vulnerabilidade", cond:"Estratégias pactuadas com a gestão", passos:[
            { t:"Quando a estratégia pactuada for rastrear, triar e tratar, a biópsia confirmatória pode ser omitida diante de achados anormais menores ou maiores, e o tratamento deve ser feito preferencialmente no mesmo dia.", ref:"6e.2.3", tom:"tratar" },
            { t:"Em comunidades isoladas com acesso limitado à excisão, o tratamento ablativo pode ser feito a partir de um DNA-HPV positivo, sempre precedido de triagem por IVA ou colposcopia e respeitados os critérios de elegibilidade.", ref:"6e.2.4", tom:"tratar" },
            { t:"Atrofia genital e deficiência estrogênica, inclusive em pessoas em uso de testosterona: considerar estriol tópico 1 mg/g, um aplicador ao dia por 14 noites, com colposcopia de 3 a 7 dias após a suspensão.", ref:"6e.1.6", tom:"investigar" },
            { t:"Barreira ao exame especular: explicação clara do resultado, linguagem afirmativa, espéculo de menor calibre e outras adaptações técnicas pactuadas com a pessoa.", ref:"6e.1.7", tom:"investigar" }
          ] }
      ]
    }
  ];

  /* ---------------- renderizacao ---------------- */

  function esc(s){
    return String(s).replace(/[&<>]/g, function(c){
      return c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;";
    });
  }

  function htmlPassos(passos){
    if(!passos || !passos.length) return "";
    var li = passos.map(function(p,i){
      return '<li data-n="'+(i+1)+'"><span class="tom '+p.tom+'">'+p.tom+'</span>'+
             esc(p.t)+' <span class="ref">'+esc(p.ref)+'</span></li>';
    }).join("");
    return '<ol class="passos">'+li+'</ol>';
  }

  function htmlRamos(ramos){
    if(!ramos || !ramos.length) return "";
    var linhas = ramos.map(function(r){
      return '<div class="ramo"><div class="se">'+esc(r.se)+'</div>'+
             '<div class="entao"><span class="tom '+r.tom+'">'+r.tom+'</span>'+
             esc(r.entao)+' <span class="ref">'+esc(r.ref)+'</span></div></div>';
    }).join("");
    return '<div class="ramos-titulo">Conforme o resultado</div>'+linhas;
  }

  function htmlSeguimento(){
    return '<div class="ramos-titulo" style="margin-top:22px">Seguimento criterioso, em detalhe</div>'+
           htmlPassos(copia(SEG_CRITERIOSO));
  }

  function htmlCorpo(r){
    return htmlPassos(r.passos) + htmlRamos(r.ramos) +
           (r.seguimento ? htmlSeguimento() : "") +
           (r.nota ? '<div class="nota">'+esc(r.nota)+'</div>' : "");
  }

  /* ---------------- montagem da pagina ---------------- */

  var raiz = document.getElementById("raiz");

  var abas = [{id:"navegador", rotulo:"Navegador de conduta"}]
    .concat(CAPITULOS.map(function(c){ return {id:c.id, rotulo:c.titulo.split(" ").slice(0,4).join(" ")}; }))
    .concat([{id:"defs", rotulo:"Definições e siglas"}]);

  abas[1].rotulo = "Colposcopia normal ou menor";
  abas[2].rotulo = "Achados anormais maiores";
  abas[3].rotulo = "Doença glandular";
  abas[4].rotulo = "Câncer IA1 e suspeita";
  abas[5].rotulo = "Tratamento e pós-tratamento";
  abas[6].rotulo = "Situações especiais";

  var html = '';

  html += '<header class="capa"><div class="env">'+
    '<div class="selo">Conitec · INCA · Ministério da Saúde · julho de 2026</div>'+
    '<h1>Como avaliar, tratar e seguir mulheres identificadas no rastreamento do câncer do colo do útero</h1>'+
    '<p class="sub">Fluxograma de consulta das Diretrizes Brasileiras para o Rastreamento do Câncer do Colo do Útero, Parte II. Cada conduta traz o número da recomendação de origem, para conferência no documento completo.</p>'+
    '<div class="aviso"><div><b>Versão preliminar.</b> O documento de origem está em consulta pública e pode sofrer alteração. Este material resume as recomendações e não substitui a leitura do texto integral nem o julgamento clínico.</div></div>'+
    '</div></header>';

  html += '<div class="abas-barra"><div class="env"><div class="abas" role="tablist">'+
    abas.map(function(a,i){
      return '<button class="aba" role="tab" id="aba-'+a.id+'" aria-controls="painel-'+a.id+'" '+
             'aria-selected="'+(i===0)+'" data-alvo="'+a.id+'">'+esc(a.rotulo)+'</button>';
    }).join("")+
    '</div></div></div>';

  /* painel navegador */
  html += '<section class="painel env" id="painel-navegador" role="tabpanel" aria-labelledby="aba-navegador">'+
    '<h2>Qual é a conduta para esta mulher?</h2>'+
    '<p class="lede">Preencha o que você já tem em mãos. O resultado aparece abaixo, com a recomendação correspondente.</p>'+
    '<div class="nav-grade">'+
      campo("pop","População",[["habitual","Risco habitual"],["imuno","Vivendo com HIV ou imunossuprimida"],["gestante","Gestante"]])+
      campo("colpo","Impressão colposcópica",[["normal","Normal ou achados anormais menores"],["maiores","Achados anormais maiores"],["invasao","Suspeita de invasão ou lesão tumoral"]])+
      campo("gen","Genótipo do HPV",[["1618","HPV 16 ou 18"],["outros","HPV oncogênico diferente de 16/18"]])+
      campo("cito","Citologia reflexa",[["ascus_lsil","ASC-US ou LSIL"],["agc","AGC-SOE"],["asch_hsil","ASC-H ou HSIL"],["grave","HSIL não podendo excluir microinvasão, AGC-FN, AIS ou câncer"],["negativa","Negativa"],["ausente","Ausente ou insatisfatória"]])+
      campo("zt","Zona de transformação",[["12","Tipo 1 ou 2, JEC visível"],["3","Tipo 3, JEC não visível"]])+
    '</div>'+
    '<div id="saida"></div>'+
  '</section>';

  /* paineis de capitulos */
  CAPITULOS.forEach(function(c){
    var blocos = c.blocos.map(function(b){
      var r = b.r || b;
      return '<article class="bloco">'+
        '<p class="entrada">'+esc(b.entrada)+'</p>'+
        '<p class="condicao">'+esc(b.cond)+'</p>'+
        htmlCorpo(r)+
      '</article>';
    }).join("");
    html += '<section class="painel env" id="painel-'+c.id+'" role="tabpanel" aria-labelledby="aba-'+c.id+'" hidden>'+
      '<h2>'+esc(c.titulo)+'</h2>'+
      '<p class="lede">'+esc(c.lede)+'</p>'+
      legenda()+
      blocos+
    '</section>';
  });

  /* painel definicoes */
  html += '<section class="painel env" id="painel-defs" role="tabpanel" aria-labelledby="aba-defs" hidden>'+
    '<h2>Definições e siglas</h2>'+
    '<p class="lede">Termos que aparecem repetidamente nos fluxos.</p>'+
    '<dl class="defs">'+
      def("Seguimento criterioso","Colposcopia e citologia aos 6, 12 e 18 meses, com teste de DNA-HPV oncogênico aos 12 e 24 meses. Tudo negativo em 24 meses leva a novo DNA-HPV após 12 meses e, sendo negativo, ao rastreamento a cada 5 anos. DNA-HPV positivo em qualquer momento mantém colposcopia e citologia anuais. Citologia com ASC-US ou pior durante o seguimento indica excisão tipo 3. Recomendações 1.3.3a a 1.3.3d.")+
      def("Teste de cura","Dois testes de DNA-HPV oncogênico consecutivamente negativos com 12 meses de intervalo, aos 6 e aos 18 meses do tratamento. Recomendação 5.3.3.")+
      def("Tipos de zona de transformação","Tipo 1: ZT e JEC completamente visíveis, ectocervical. Tipo 2: ZT com componente endocervical, mas JEC ainda completamente visível. Tipo 3: JEC não completamente visível, dentro do canal. Recomendação 5.2.4 e capítulo 7.")+
      def("Tipos de excisão","Tipo 1 para ZT tipo 1, até 10 mm de profundidade. Tipo 2 para ZT tipo 2, até 15 mm. Tipo 3 acima de 15 mm, preferencialmente 20 mm, indicada para ZT tipo 3, doença escamosa extensa, suspeita de microinvasão ou doença glandular comprovada ou suspeita. Recomendação 5.2.4.")+
      def("Triar e tratar","Tratamento excisional sem biópsia prévia, indicado quando o teste primário e o teste de triagem são positivos: HPV 16/18 com achados anormais maiores, ou HPV diferente de 16/18 com citologia ASC-H ou HSIL e achados anormais maiores. Recomendações 2.1.1 e 2.3.1.")+
      def("Critérios para termoablação","ZT visível, tipo 1 ou 2; todas as áreas sugestivas de lesão totalmente visíveis; ausência de suspeita de câncer ou de doença glandular. Não realizar em gestantes nem na vigência de infecção aguda do colo ou da vagina. Quadro 1 e recomendação 6e.2.4.")+
      def("Abordagem conservadora da HSIL (NIC2)","Só é possível quando a biópsia mostra HSIL (NIC2), a JEC está completamente visível (ZT tipo 1 ou 2), não há suspeita de lesão mais grave no canal e o seguimento está garantido. Não é aceitável em ZT tipo 3. Recomendação 2.1.4.")+
      def("Imunossupressão","Mulheres vivendo com HIV, com lúpus eritematoso sistêmico, transplantadas de órgãos sólidos ou de células-progenitoras hematopoiéticas, e portadoras de doenças crônicas em tratamento imunossupressor recorrente. Recomendação 5.3.8 e capítulo 6c.")+
    '</dl>'+
    '<h3>Siglas</h3>'+
    '<table class="siglas">'+
      sig("AGC-SOE","Atipias em células glandulares sem outra especificação")+
      sig("AGC-FN","Atipias em células glandulares favorecendo neoplasia")+
      sig("AIS","Adenocarcinoma in situ")+
      sig("APS","Atenção primária à saúde")+
      sig("ASC-US","Atipias em células escamosas de significado indeterminado")+
      sig("ASC-H","Atipias em células escamosas não podendo excluir lesão de alto grau")+
      sig("ASC-H+","ASC-H, HSIL, HSIL não podendo excluir microinvasão, AGC-FN, AIS, adenocarcinoma invasor e carcinoma escamoso invasor")+
      sig("ASC-US+","ASC-US e todas as categorias de ASC-H+")+
      sig("EZT","Exérese da zona de transformação")+
      sig("HSIL","Lesão intraepitelial escamosa de alto grau")+
      sig("IVA","Inspeção visual com ácido acético")+
      sig("JEC","Junção escamocolunar")+
      sig("LSIL","Lesão intraepitelial escamosa de baixo grau")+
      sig("NIC1, NIC2, NIC3","Neoplasia intraepitelial escamosa graus 1, 2 e 3")+
      sig("ZT","Zona de transformação")+
    '</table>'+
    '<p class="rodape">Fonte: Ministério da Saúde, Conitec, INCA. Diretrizes Brasileiras para o Rastreamento do Câncer do Colo do Útero, Parte II: como avaliar, tratar e seguir mulheres identificadas no rastreamento do câncer de colo do útero. Relatório de recomendação, Brasília, julho de 2026, versão preliminar sujeita a consulta pública. As numerações citadas remetem às recomendações do documento original.</p>'+
  '</section>';

  raiz.innerHTML = html;

  function campo(id,rotulo,opcoes){
    return '<div class="campo" id="campo-'+id+'"><label for="sel-'+id+'">'+esc(rotulo)+'</label>'+
      '<select id="sel-'+id+'">'+
      opcoes.map(function(o){ return '<option value="'+o[0]+'">'+esc(o[1])+'</option>'; }).join("")+
      '</select></div>';
  }
  function def(t,d){ return '<dt>'+esc(t)+'</dt><dd>'+esc(d)+'</dd>'; }
  function sig(a,b){ return '<tr><td>'+esc(a)+'</td><td>'+esc(b)+'</td></tr>'; }
  function legenda(){
    return '<div class="legenda">'+
      '<span><span class="tom investigar">investigar</span> exame adicional</span>'+
      '<span><span class="tom vigiar">vigiar</span> seguimento programado</span>'+
      '<span><span class="tom tratar">tratar</span> procedimento</span>'+
      '<span><span class="tom encaminhar">encaminhar</span> outro nível de atenção</span>'+
      '<span><span class="tom alta">alta</span> retorno ao rastreamento</span>'+
    '</div>';
  }

  /* ---------------- interacao ---------------- */

  var sel = {
    pop: document.getElementById("sel-pop"),
    colpo: document.getElementById("sel-colpo"),
    gen: document.getElementById("sel-gen"),
    cito: document.getElementById("sel-cito"),
    zt: document.getElementById("sel-zt")
  };
  var saida = document.getElementById("saida");

  function visivel(id,mostrar){
    document.getElementById("campo-"+id).classList.toggle("oculto", !mostrar);
  }

  function atualizar(){
    var e = { pop:sel.pop.value, colpo:sel.colpo.value, gen:sel.gen.value, cito:sel.cito.value, zt:sel.zt.value };

    var mostraGen = e.colpo !== "invasao" && e.pop !== "imuno";
    var mostraCito = e.colpo !== "invasao" && (e.pop === "imuno" || (mostraGen && e.gen === "outros"));
    var mostraZt = e.colpo !== "invasao" && !(e.pop === "habitual" && e.colpo === "maiores");
    visivel("gen", mostraGen);
    visivel("cito", mostraCito);
    visivel("zt", mostraZt);

    var r = decidir(e);
    var cenario = [
      e.pop === "habitual" ? "Risco habitual" : (e.pop === "imuno" ? "Imunossupressão" : "Gestante"),
      sel.colpo.options[sel.colpo.selectedIndex].text,
      mostraGen ? sel.gen.options[sel.gen.selectedIndex].text : null,
      mostraCito ? "citologia " + sel.cito.options[sel.cito.selectedIndex].text : null,
      mostraZt ? "ZT " + (e.zt === "12" ? "1 ou 2" : "3") : null
    ].filter(Boolean).join("  ·  ");

    saida.innerHTML = '<div class="resultado">'+
      '<div class="cenario">'+esc(cenario)+'</div>'+
      '<h4>'+esc(r.titulo)+'</h4>'+
      legenda()+
      htmlCorpo(r)+
    '</div>';
  }

  Object.keys(sel).forEach(function(k){ sel[k].addEventListener("change", atualizar); });
  atualizar();

  /* abas */
  var botoes = Array.prototype.slice.call(raiz.querySelectorAll(".aba"));
  botoes.forEach(function(b){
    b.addEventListener("click", function(){
      botoes.forEach(function(o){
        var ativo = o === b;
        o.setAttribute("aria-selected", ativo);
        document.getElementById("painel-"+o.dataset.alvo).hidden = !ativo;
      });
      window.scrollTo({ top:0, behavior:"smooth" });
    });
  });
})();
</script>
